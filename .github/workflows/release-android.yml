name: Release Android APK & AAB

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Verificar mensaje de commit
        id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Commit: $COMMIT_MSG"
          if echo "$COMMIT_MSG" | grep -qi "release apk"; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ Trigger detectado: release apk"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "⏭️  Sin trigger de release apk, omitiendo build"
          fi

  build-and-sign:
    needs: check-trigger
    if: needs.check-trigger.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build app web (Vite)
        run: npm run build
        env:
          VITE_WHATSAPP_NUMBER: ${{ secrets.VITE_WHATSAPP_NUMBER }}

      - name: Inicializar plataforma Android
        run: npx cap add android

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Agregar permisos de ubicacion al AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />|' "$MANIFEST"
          echo "✅ Permisos de ubicacion agregados"
          grep -i "location" "$MANIFEST"

      - name: Generar íconos y splash screen para Android
        run: npx @capacitor/assets generate --android

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permisos a Gradle wrapper
        working-directory: android
        run: chmod +x gradlew

      - name: Build APK release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build AAB release
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Decodificar Keystore desde secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > fogonazo-release.keystore
          echo "✅ Keystore restaurado"

      - name: Firmar APK con zipalign + apksigner
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/app-release-signed.apk"
          ALIGNED_APK="android/app/build/outputs/apk/release/app-release-aligned.apk"

          # Zipalign
          $ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/zipalign \
            -v 4 "$APK_PATH" "$ALIGNED_APK"

          # Firmar
          $ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/apksigner \
            sign \
            --ks fogonazo-release.keystore \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          echo "✅ APK firmado: $SIGNED_APK"
          ls -lh android/app/build/outputs/apk/release/

      - name: Firmar AAB
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          SIGNED_AAB="android/app/build/outputs/bundle/release/app-release-signed.aab"

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore fogonazo-release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -signedjar "$SIGNED_AAB" \
            "$AAB_PATH" \
            "${{ secrets.KEY_ALIAS }}"

          echo "✅ AAB firmado: $SIGNED_AAB"
          ls -lh android/app/build/outputs/bundle/release/

      - name: Subir APK firmado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: fogonazo-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 30

      - name: Subir AAB firmado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: fogonazo-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release-signed.aab
          retention-days: 30

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}-release"
          name: "Al Fogonazo v${{ github.run_number }}"
          body: |
            ## 🔥 Al Fogonazo - Release Build ${{ github.run_number }}

            **Commit:** ${{ github.sha }}
            **Mensaje:** ${{ github.event.head_commit.message }}

            ### Archivos disponibles:
            - `app-release-signed.apk` - Instalación directa en Android
            - `app-release-signed.aab` - Para subir a Google Play Store
          files: |
            android/app/build/outputs/apk/release/app-release-signed.apk
            android/app/build/outputs/bundle/release/app-release-signed.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Limpiar keystore del runner
        if: always()
        run: rm -f fogonazo-release.keystore
